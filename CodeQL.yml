path_classifiers:
  test:
    - test
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/*.integrationTest.ts"
  generated:
    - out
    - "out-build"
    - "out-vscode"
    - "out-react"
    - "**/out/**"
    - "**/dist/**"
    - ".build/distro/cli-patches/index.js"
  library:
    - "**/node_modules/**"
    - "cli/target/**"
