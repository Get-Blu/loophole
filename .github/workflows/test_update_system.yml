name: Test Update System

on:
  workflow_dispatch:
    inputs:
      mock_current_version:
        description: 'Fake current version to test against (e.g. 0.0.1 to force update, or 99.99.99 to force up-to-date)'
        required: false
        default: '0.0.1'

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Unit tests: version comparison, asset matching, state machine logic
  # Runs on Linux, no Electron needed
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Logic)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Write test script
        run: |
          cat > /tmp/test-update-logic.mjs << 'EOF'
          // ─── Replicated helpers from voidUpdateMainService.ts ────────────────────────

          const stripBuild = (v) => v.replace(/-.*$/, '')
          const parseVer = (v) => stripBuild(v).split('.').map(Number)
          const isOutdated = (myVersion, latestVersion) => {
            const [la, lb, lc] = parseVer(latestVersion)
            const [ca, cb, cc] = parseVer(myVersion)
            return la > ca || (la === ca && lb > cb) || (la === ca && lb === cb && lc > cc)
          }

          // ─── Asset matching (mirrors _findAssetForPlatform) ──────────────────────────

          const findAsset = (assets, platformName, archName) => {
            let patterns = []
            if (platformName === 'win32') {
              patterns = archName === 'arm64'
                ? ['LoopholeUserSetup-arm64', 'LoopholeSetup-arm64', 'UserSetup-arm64']
                : ['LoopholeUserSetup-x64', 'LoopholeSetup-x64', 'UserSetup-x64']
            } else if (platformName === 'darwin') {
              patterns = archName === 'arm64'
                ? ['Loophole.arm64', 'loophole-arm64', 'arm64.dmg']
                : ['Loophole.x64', 'loophole-x64', 'x64.dmg']
            } else {
              patterns = archName === 'arm64'
                ? ['Loophole-linux-arm64', 'linux-arm64', 'arm64.tar.gz']
                : ['Loophole-linux-x64', 'linux-x64', 'x64.tar.gz']
            }
            for (const pattern of patterns) {
              const asset = assets.find(a => a.name.toLowerCase().includes(pattern.toLowerCase()))
              if (asset) return asset
            }
            return assets.find(a => {
              const name = a.name.toLowerCase()
              return name.endsWith('.exe') || name.endsWith('.dmg') || name.endsWith('.tar.gz') || name.endsWith('.appimage') || name.endsWith('.deb')
            })
          }

          // ─── Test runner ─────────────────────────────────────────────────────────────

          let passed = 0
          let failed = 0
          const results = []

          const test = (name, fn) => {
            try {
              fn()
              results.push({ name, status: 'PASS' })
              passed++
            } catch (e) {
              results.push({ name, status: 'FAIL', error: e.message })
              failed++
            }
          }

          const assert = (condition, msg) => { if (!condition) throw new Error(msg) }
          const assertEqual = (a, b) => { if (a !== b) throw new Error(`Expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`) }

          // ─── Version comparison tests ─────────────────────────────────────────────────

          test('older major version is outdated', () => assert(isOutdated('1.0.0', '2.0.0')))
          test('older minor version is outdated', () => assert(isOutdated('1.0.0', '1.1.0')))
          test('older patch version is outdated', () => assert(isOutdated('1.0.0', '1.0.1')))
          test('same version is NOT outdated', () => assert(!isOutdated('1.2.3', '1.2.3')))
          test('newer version is NOT outdated', () => assert(!isOutdated('2.0.0', '1.0.0')))
          test('build metadata is stripped before compare', () => assert(!isOutdated('1.91.7-202605090344', '1.91.7')))
          test('build metadata stripped: older is still outdated', () => assert(isOutdated('1.91.6-202605090344', '1.91.7')))
          test('v-prefix stripped from tag_name', () => assert(isOutdated('0.0.1', 'v2.0.0'.replace(/^v/, ''))))
          test('zero versions compare correctly', () => assert(isOutdated('0.0.0', '0.0.1')))
          test('large version numbers compare correctly', () => assert(!isOutdated('10.0.0', '9.99.99')))
          test('mock_current_version input would trigger update', () => {
            const mockVersion = '${{ github.event.inputs.mock_current_version }}'
            // Any version ≤ 0.0.1 should be outdated against any real release
            if (mockVersion === '0.0.1') {
              assert(isOutdated('0.0.1', '1.0.0'), 'mock version 0.0.1 should show as outdated vs 1.0.0')
            } else if (mockVersion === '99.99.99') {
              assert(!isOutdated('99.99.99', '1.0.0'), 'mock version 99.99.99 should NOT be outdated vs 1.0.0')
            }
          })

          // ─── Asset matching tests ─────────────────────────────────────────────────────

          const mockAssets = [
            { name: 'LoopholeUserSetup-x64-2.1.0.exe',    browser_download_url: 'https://example.com/win-x64.exe',    size: 100 },
            { name: 'LoopholeUserSetup-arm64-2.1.0.exe',  browser_download_url: 'https://example.com/win-arm64.exe',  size: 100 },
            { name: 'Loophole.x64.2.1.0.dmg',             browser_download_url: 'https://example.com/mac-x64.dmg',    size: 100 },
            { name: 'Loophole.arm64.2.1.0.dmg',           browser_download_url: 'https://example.com/mac-arm64.dmg',  size: 100 },
            { name: 'Loophole-linux-x64-2.1.0.tar.gz',    browser_download_url: 'https://example.com/linux-x64.tgz',  size: 100 },
            { name: 'Loophole-linux-arm64-2.1.0.tar.gz',  browser_download_url: 'https://example.com/linux-arm64.tgz',size: 100 },
          ]

          test('windows x64 matches correct asset', () => {
            const asset = findAsset(mockAssets, 'win32', 'x64')
            assert(asset !== undefined, 'no asset found')
            assert(asset.name.includes('x64') && asset.name.endsWith('.exe'), `wrong asset: ${asset.name}`)
          })
          test('windows arm64 matches correct asset', () => {
            const asset = findAsset(mockAssets, 'win32', 'arm64')
            assert(asset !== undefined, 'no asset found')
            assert(asset.name.includes('arm64') && asset.name.endsWith('.exe'), `wrong asset: ${asset.name}`)
          })
          test('mac x64 matches correct asset', () => {
            const asset = findAsset(mockAssets, 'darwin', 'x64')
            assert(asset !== undefined, 'no asset found')
            assert(asset.name.includes('x64') && asset.name.endsWith('.dmg'), `wrong asset: ${asset.name}`)
          })
          test('mac arm64 matches correct asset', () => {
            const asset = findAsset(mockAssets, 'darwin', 'arm64')
            assert(asset !== undefined, 'no asset found')
            assert(asset.name.includes('arm64') && asset.name.endsWith('.dmg'), `wrong asset: ${asset.name}`)
          })
          test('linux x64 matches correct asset', () => {
            const asset = findAsset(mockAssets, 'linux', 'x64')
            assert(asset !== undefined, 'no asset found')
            assert(asset.name.includes('x64') && asset.name.endsWith('.tar.gz'), `wrong asset: ${asset.name}`)
          })
          test('linux arm64 matches correct asset', () => {
            const asset = findAsset(mockAssets, 'linux', 'arm64')
            assert(asset !== undefined, 'no asset found')
            assert(asset.name.includes('arm64') && asset.name.endsWith('.tar.gz'), `wrong asset: ${asset.name}`)
          })
          test('no asset for unknown platform falls back to any installer', () => {
            const asset = findAsset(mockAssets, 'freebsd', 'x64')
            // fallback should pick something that looks like an installer
            assert(asset !== undefined, 'expected a fallback asset but got nothing')
          })
          test('windows arm64 does NOT pick x64 asset', () => {
            const asset = findAsset(mockAssets, 'win32', 'arm64')
            assert(!asset.name.includes('-x64-'), `arm64 matched x64 asset: ${asset.name}`)
          })

          // ─── BUG CHECK: null response should NOT trigger error notification ──────────

          test('null response is not treated as error (bug check)', () => {
            // In voidUpdateActions.ts performLoopholeCheck:
            // if (!res) → shows error. But null = "no update, stay silent"
            // This test documents the bug: null is falsy, so !null === true
            const res = null
            const wouldShowError = !res  // this is what the current code does
            assert(wouldShowError === true, 'confirm bug exists: null triggers error path')
            // The correct check should be:
            const correctCheck = res === undefined  // only undefined = actual error
            assert(correctCheck === false, 'correct check: null should NOT trigger error')
          })

          // ─── Response type shape tests ────────────────────────────────────────────────

          test('valid action values are constrained', () => {
            const validActions = ['reinstall', 'restart', 'download', 'apply']
            for (const action of validActions) {
              assert(validActions.includes(action), `invalid action: ${action}`)
            }
          })

          // ─── Print results ────────────────────────────────────────────────────────────

          console.log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
          console.log('  LOOPHOLE UPDATE SYSTEM — UNIT TEST RESULTS')
          console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n')
          for (const r of results) {
            const icon = r.status === 'PASS' ? '✅' : '❌'
            console.log(`  ${icon}  ${r.name}`)
            if (r.error) console.log(`       └─ ${r.error}`)
          }
          console.log(`\n  Results: ${passed} passed, ${failed} failed out of ${passed + failed} tests\n`)
          console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n')

          if (failed > 0) process.exit(1)
          EOF

      - name: Run unit tests
        run: node /tmp/test-update-logic.mjs

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Live GitHub API test: can we actually reach the releases endpoint?
  # ─────────────────────────────────────────────────────────────────────────────
  github-api-test:
    name: Live GitHub API Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest release from GitHub API
        id: fetch_release
        run: |
          echo "Fetching latest release from loophole-ai/loophole-ide..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "User-Agent: Loophole-UpdateTest/1.0" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/loophole-ai/loophole-ide/releases/latest")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ API reachable"
            TAG=$(echo "$BODY" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.parse(d).tag_name))")
            ASSET_COUNT=$(echo "$BODY" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.parse(d).assets.length))")
            ASSET_NAMES=$(echo "$BODY" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>JSON.parse(d).assets.forEach(a=>console.log('  -',a.name)))")
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
            echo "asset_count=$ASSET_COUNT" >> $GITHUB_OUTPUT
            echo ""
            echo "Latest release tag: $TAG"
            echo "Number of assets:   $ASSET_COUNT"
            echo "Assets:"
            echo "$ASSET_NAMES"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "⚠️  No releases published yet (404) — this is expected if you haven't shipped a release"
            echo "tag_name=none" >> $GITHUB_OUTPUT
            echo "asset_count=0" >> $GITHUB_OUTPUT
          else
            echo "❌ Unexpected HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

      - name: Validate asset names match expected patterns
        if: steps.fetch_release.outputs.asset_count != '0'
        run: |
          echo "Checking asset names cover all platforms..."

          RELEASE=$(curl -s \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/loophole-ai/loophole-ide/releases/latest")

          node - << 'JSEOF'
          const fs = require('fs')
          const releaseJson = `${{ steps.fetch_release.outputs.asset_count }}`

          // Re-fetch inline for node parsing
          const { execSync } = require('child_process')
          const raw = execSync(`curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/loophole-ai/loophole-ide/releases/latest"`).toString()
          const release = JSON.parse(raw)
          const assets = release.assets.map(a => a.name)

          console.log('\nAssets found:')
          assets.forEach(a => console.log(' -', a))

          const checks = [
            { label: 'Windows x64',  match: a => (a.includes('x64') || a.includes('amd64')) && a.endsWith('.exe') },
            { label: 'macOS arm64',  match: a => a.includes('arm64') && a.endsWith('.dmg') },
            { label: 'macOS x64',    match: a => (a.includes('x64') || a.includes('amd64')) && a.endsWith('.dmg') },
            { label: 'Linux x64',    match: a => (a.includes('x64') || a.includes('amd64')) && (a.endsWith('.tar.gz') || a.endsWith('.deb') || a.endsWith('.AppImage')) },
          ]

          let allGood = true
          console.log('\nPlatform coverage:')
          for (const check of checks) {
            const found = assets.some(check.match)
            console.log(` ${found ? '✅' : '⚠️ '} ${check.label}: ${found ? 'found' : 'MISSING'}`)
            if (!found) allGood = false
          }

          if (!allGood) {
            console.log('\n⚠️  Some platforms are missing assets — update will fall back to reinstall prompt for those users')
          } else {
            console.log('\n✅ All platforms covered')
          }
          JSEOF

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Version comparison against real release using mock_current_version
  # ─────────────────────────────────────────────────────────────────────────────
  version-check-simulation:
    name: Version Check Simulation
    runs-on: ubuntu-22.04
    needs: github-api-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Simulate version check with mock version
        run: |
          MOCK_VERSION="${{ github.event.inputs.mock_current_version }}"
          echo "Simulating app running version: $MOCK_VERSION"
          echo ""

          RELEASE=$(curl -s \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/loophole-ai/loophole-ide/releases/latest")

          node - "$MOCK_VERSION" << 'JSEOF'
          const myVersion = process.argv[2]

          let releaseData = ''
          process.stdin.on('data', d => releaseData += d)
          process.stdin.on('end', () => {
            let release
            try { release = JSON.parse(releaseData) } catch(e) {
              console.log('⚠️  No releases found or invalid JSON — skipping version simulation')
              process.exit(0)
            }

            if (!release.tag_name) {
              console.log('⚠️  No releases published yet — skipping')
              process.exit(0)
            }

            const latestVersion = release.tag_name.replace(/^v/, '')
            const stripBuild = v => v.replace(/-.*$/, '')
            const parseVer = v => stripBuild(v).split('.').map(Number)
            const [la, lb, lc] = parseVer(latestVersion)
            const [ca, cb, cc] = parseVer(myVersion)
            const isOutdated = la > ca || (la === ca && lb > cb) || (la === ca && lb === cb && lc > cc)

            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
            console.log('  VERSION CHECK SIMULATION')
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
            console.log(`  Mock current version : ${myVersion}`)
            console.log(`  Latest release       : ${latestVersion} (${release.tag_name})`)
            console.log(`  Is outdated          : ${isOutdated ? '✅ YES — update would be offered' : '✅ NO — user would see "up to date"'}`)
            console.log('')

            if (isOutdated) {
              console.log('  What the user would see:')
              console.log('  → Notification: "A new version is available!"')
              console.log('  → Button: Download')
              console.log('  → After download: "Restart Loophole to update!"')
              console.log('  → Status bar entry: ☁ Update Ready')
            } else {
              console.log('  What the user would see:')
              console.log('  → Notification (if manual check): "Loophole is up-to-date!"')
              console.log('  → No status bar entry')
            }
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
          })
          JSEOF <<< "$RELEASE"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Windows .bat watcher script validation
  # ─────────────────────────────────────────────────────────────────────────────
  bat-script-validation:
    name: Windows Batch Script Validation
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate batch script syntax and logic
        shell: pwsh
        run: |
          Write-Host "Generating the update watcher batch script..."

          $cachePath = "$env:TEMP\loophole-updates-test"
          $installerPath = "$cachePath\FakeLoophole-2.0.0.exe"
          $scriptPath = "$cachePath\update-watcher.bat"

          New-Item -ItemType Directory -Force -Path $cachePath | Out-Null

          # Create a fake installer (just echoes success)
          @"
          @echo off
          echo [FAKE INSTALLER] Running silently...
          echo [FAKE INSTALLER] Done.
          exit /b 0
          "@ | Set-Content -Path $installerPath -Encoding ASCII

          # Replicate exactly the batch script from quitAndInstall
          $batchLines = @(
            "@echo off",
            ":: Wait for Loophole to close",
            "set /a attempts=0",
            ":waitloop",
            "set /a attempts+=1",
            "if %attempts% gtr 40 goto runinstaller",
            "ping -n 2 127.0.0.1 >nul 2>&1",
            "tasklist /FI `"IMAGENAME eq loophole.exe`" 2>nul | find /I `"loophole.exe`" >nul",
            "if %errorlevel% equ 0 goto waitloop",
            "",
            ":runinstaller",
            ":: Run installer and wait for it to finish before cleaning up",
            "start /wait `"`" `"$installerPath`" /verysilent /mergetasks=!runcode,!desktopicon,!quicklaunchicon /nocancel",
            ":: Clean up only after installer exits",
            "rmdir /s /q `"$cachePath`"",
            "del `"%~f0`""
          )
          $batchLines -join "`r`n" | Set-Content -Path $scriptPath -Encoding ASCII

          Write-Host ""
          Write-Host "✅ Batch script created at: $scriptPath"
          Write-Host ""
          Write-Host "Checking script syntax..."

          # Use cmd /c to parse without running (syntax check only)
          $result = cmd /c "if exist `"$scriptPath`" (echo EXISTS) else (echo MISSING)" 2>&1
          if ($result -match "EXISTS") {
            Write-Host "✅ Script file created successfully"
          } else {
            Write-Host "❌ Script file missing"
            exit 1
          }

          # Check that the script contains all expected sections
          $content = Get-Content $scriptPath -Raw
          $checks = @(
            @{ label = "Has waitloop label";     pattern = ":waitloop" },
            @{ label = "Has runinstaller label"; pattern = ":runinstaller" },
            @{ label = "Has tasklist check";     pattern = "tasklist" },
            @{ label = "Has attempt counter";    pattern = "attempts" },
            @{ label = "Has cleanup";            pattern = "rmdir" },
            @{ label = "Has silent flag";        pattern = "/verysilent" }
          )

          Write-Host ""
          Write-Host "Script content checks:"
          $allPass = $true
          foreach ($check in $checks) {
            if ($content -match [regex]::Escape($check.pattern)) {
              Write-Host "  ✅ $($check.label)"
            } else {
              Write-Host "  ❌ $($check.label) — pattern '$($check.pattern)' not found"
              $allPass = $false
            }
          }

          Write-Host ""
          Write-Host "⚠️  KNOWN BUG CHECK: process name in tasklist"
          Write-Host "  The script checks for 'loophole.exe'"
          Write-Host "  Verify this matches your actual process name in Task Manager"
          Write-Host "  If it doesn't match, the watcher waits all 40 retries (~80s) before installing"
          Write-Host ""

          if (-not $allPass) { exit 1 }
          Write-Host "✅ All batch script checks passed"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Summary: print all results in one place
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: Test Summary
    runs-on: ubuntu-22.04
    needs: [unit-tests, github-api-test, version-check-simulation, bat-script-validation]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  LOOPHOLE UPDATE SYSTEM — TEST RUN COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Unit Tests (logic):          ${{ needs.unit-tests.result }}"
          echo "  GitHub API reachability:     ${{ needs.github-api-test.result }}"
          echo "  Version check simulation:    ${{ needs.version-check-simulation.result }}"
          echo "  Windows .bat validation:     ${{ needs.bat-script-validation.result }}"
          echo ""
          echo "  mock_current_version used:   ${{ github.event.inputs.mock_current_version }}"
          echo ""
          echo "  Known bugs flagged (not failing CI, just documented):"
          echo "  1. null response triggers error notification — should be silent"
          echo "  2. .bat watcher checks 'loophole.exe' — verify this is your real process name"
          echo "  3. No file integrity check after download (size/hash not verified)"
          echo "  4. _useGitHubUpdates never reset after error — downloadUpdate() returns false on retry"
