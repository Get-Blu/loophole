  # ─────────────────────────────────────────────────────────────────────────────
  # Alpine x64 (musl) — REH + REH-Web only
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-upload-alpine-x64:
    name: Build & Upload Alpine x64 (musl)
    runs-on: ubuntu-22.04
    environment: publish
    env:
      VERSION: ${{ inputs.version || github.event.inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Alpine x64 in Docker (musl)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --platform linux/amd64 \
            node:20-alpine sh -c "
              set -e
              apk add --no-cache bash curl git python3 py3-pip make gcc g++ \
                libx11-dev libxkbfile-dev libsecret-dev krb5-dev musl-dev pkgconfig
              curl https://sh.rustup.rs -sSf | sh -s -- -y --target x86_64-unknown-linux-musl
              export PATH=\"\$HOME/.cargo/bin:\$PATH\"
              npm ci
              cd src/vs/workbench/contrib/void/browser/react && npm install && cd -
              npm run buildreact
              npm run compile
              cd cli && cargo build --release --target x86_64-unknown-linux-musl && cd ..
              npm run gulp vscode-reh-linux-x64-ci
              npm run gulp vscode-reh-web-linux-x64-ci
