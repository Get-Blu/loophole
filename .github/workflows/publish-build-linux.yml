                fi

                echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"alpine-x64\"}" >> gofile-links-alpine-x64.json
              fi
            fi
          done

          echo "]" >> gofile-links-alpine-x64.json

      - name: Upload Gofile links artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-links-alpine-x64
          path: gofile-links-alpine-x64.json
          retention-days: 7

