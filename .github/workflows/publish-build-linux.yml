name: Publish Build — Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish (e.g. 1.121.03429)'
        required: true

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Linux x64
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-upload-linux-x64:
    name: Build & Upload Linux x64
    runs-on: ubuntu-22.04
    environment: publish
    env:
      VERSION: ${{ inputs.version || github.event.inputs.version }}
      VSCODE_ARCH: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev fakeroot rpm squashfs-tools zsync snapcraft \
            python3-pip pkg-config libgtk-3-dev libnss3-dev libgbm-dev libasound2-dev

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-linux-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-linux-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-linux-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-linux-x64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Electron app (linux x64)
        run: npm run gulp vscode-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build .deb
        run: npm run gulp vscode-linux-x64-build-deb
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — .deb
        run: |
          src=$(find .build -name "*.deb" | head -1)
          cp "$src" "dist/loophole_${VERSION}_amd64.deb"

      - name: Build .rpm
        run: npm run gulp vscode-linux-x64-build-rpm
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — .rpm
        run: |
          src=$(find .build -name "*.rpm" | head -1)
          cp "$src" "dist/loophole-${VERSION}-el8.x86_64.rpm"

      - name: Build tar.gz
        run: npm run gulp vscode-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — tar.gz
        run: |
          src=$(find .build -name "VSCode-linux-x64-*.tar.gz" | head -1)
          cp "$src" "dist/Loophole-linux-x64-$VERSION.tar.gz"

      - name: Build AppImage
        run: npm run gulp vscode-linux-x64-ci
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — AppImage + .zsync
        run: |
          GLIBC=$(ldd --version | head -1 | grep -oP '\d+\.\d+$' || echo "2.30")
          src_appimage=$(find .build -name "*.AppImage" | grep -v ".zsync" | head -1)
          cp "$src_appimage" "dist/Loophole-$VERSION.glibc${GLIBC}-x86_64.AppImage"
          zsyncmake -o "dist/Loophole-$VERSION.glibc${GLIBC}-x86_64.AppImage.zsync" \
            "dist/Loophole-$VERSION.glibc${GLIBC}-x86_64.AppImage" || true

      - name: Build Snap
        run: npm run gulp vscode-linux-x64-build-snap
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Snap
        run: |
          src=$(find .build -name "*.snap" | head -1)
          [ -f "$src" ] && cp "$src" "dist/loophole_${VERSION}_amd64.snap" || true

      - name: Build Remote Host
        run: npm run gulp vscode-reh-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Remote Host
        run: |
          [ -d ".build/vscode-reh-linux-x64" ] && \
            tar -czf "dist/loophole-reh-linux-x64-$VERSION.tar.gz" -C ".build" "vscode-reh-linux-x64" || true

      - name: Build Web Host
        run: npm run gulp vscode-reh-web-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Web Host
        run: |
          [ -d ".build/vscode-reh-web-linux-x64" ] && \
            tar -czf "dist/loophole-reh-web-linux-x64-$VERSION.tar.gz" -C ".build" "vscode-reh-web-linux-x64" || true

      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/x86_64-unknown-linux-gnu/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli && cp "$cli_bin" .tmp-cli/loophole
            tar -czf "dist/loophole-cli-linux-x64-$VERSION.tar.gz" -C ".tmp-cli" loophole
          fi

      - name: Upload release assets (Linux x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            echo "Uploading $f..."
            gh release upload "$VERSION" "$f" --clobber
          done

      # ── Upload to Gofile.io and save links ─────────────────────────────────────
      - name: Upload to Gofile.io
        shell: bash
        run: |
          echo "======================================"
          echo "  Uploading artifacts to Gofile.io"
          echo "======================================"

          # Get best available server
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          if [ -z "$SERVER" ]; then
            echo "::warning::Failed to get Gofile.io server — skipping upload"
            echo "[]" > gofile-links-x64.json
            exit 0
          fi
          echo "Using server: $SERVER"

          # Create JSON array to store links
          echo "[" > gofile-links-x64.json
          FIRST=true

          for FILE in dist/*; do
            if [ -f "$FILE" ]; then
              FILENAME=$(basename "$FILE")
              echo ""
              echo "Uploading: $FILENAME"
              RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")

              # Validate response is valid JSON before parsing
              if ! echo "$RESPONSE" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
                echo "::warning::Invalid response from Gofile.io for $FILENAME"
                continue
              fi

              LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data', {}).get('downloadPage', 'N/A'))" 2>/dev/null)
              if [ -n "$LINK" ] && [ "$LINK" != "N/A" ]; then
                echo " $FILENAME → $LINK"

                # Add to JSON (handle comma for valid JSON array)
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  echo "," >> gofile-links-x64.json
                fi

                echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"linux-x64\"}" >> gofile-links-x64.json
              fi
            fi
          done

          echo "]" >> gofile-links-x64.json

      - name: Upload Gofile links artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-links-linux-x64
          path: gofile-links-x64.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux ARM64
  # ─────────────────────────────────────────────────────────────────────────────
