            ~/.cargo/git
            cli/target
          key: publish-macos-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-macos-arm64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-macos-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-macos-arm64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: arm64


      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package Electron app (darwin arm64)
        run: npm run gulp vscode-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build DMG
        run: npm run gulp vscode-darwin-arm64-ci
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — DMG
        run: |
          src=$(find .build -name "*.dmg" | head -1)
          cp "$src" "dist/Loophole.arm64.$VERSION.dmg"

      - name: Build ZIP
        run: npm run gulp vscode-darwin-arm64-ci
        env:
