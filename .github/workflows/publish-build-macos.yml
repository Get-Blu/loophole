      - name: Stage — ZIP
        run: |
          src=$(find .build -name "VSCode-darwin-arm64-*.zip" | head -1)
          cp "$src" "dist/Loophole-darwin-arm64-$VERSION.zip"

      - name: Build Remote Host
        run: npm run gulp vscode-reh-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Remote Host
        run: |
          if [ -d ".build/vscode-reh-darwin-arm64" ]; then
            tar -czf "dist/loophole-reh-darwin-arm64-$VERSION.tar.gz" -C ".build" "vscode-reh-darwin-arm64"
          fi

      - name: Build Web Host
        run: npm run gulp vscode-reh-web-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Web Host
        run: |
          if [ -d ".build/vscode-reh-web-darwin-arm64" ]; then
            tar -czf "dist/loophole-reh-web-darwin-arm64-$VERSION.tar.gz" -C ".build" "vscode-reh-web-darwin-arm64"
          fi

      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/aarch64-apple-darwin/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli && cp "$cli_bin" .tmp-cli/loophole
            tar -czf "dist/loophole-cli-darwin-arm64-$VERSION.tar.gz" -C ".tmp-cli" loophole
          fi

      - name: Upload release assets (macOS arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            echo "Uploading $f..."
            gh release upload "$VERSION" "$f" --clobber
          done
