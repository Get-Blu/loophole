name: Publish Build — macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish (e.g. 1.121.03429)'
        required: true

env:
  NODE_VERSION: '20'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # macOS x64 (Intel)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-upload-macos-x64:
    name: Build & Upload macOS x64 (Intel)
    runs-on: macos-13
    environment: publish
    env:
      VERSION: ${{ inputs.version || github.event.inputs.version }}
      VSCODE_ARCH: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-macos-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-macos-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-macos-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-macos-x64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64


      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package Electron app (darwin x64)
        run: npm run gulp vscode-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build DMG
        run: npm run gulp vscode-darwin-x64-ci
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — DMG
        run: |
          src=$(find .build -name "*.dmg" | head -1)
          cp "$src" "dist/Loophole.x64.$VERSION.dmg"

      - name: Build ZIP
        run: npm run gulp vscode-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — ZIP
        run: |
          src=$(find .build -name "VSCode-darwin-x64-*.zip" | head -1)
          cp "$src" "dist/Loophole-darwin-x64-$VERSION.zip"

      - name: Build Remote Host
        run: npm run gulp vscode-reh-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Remote Host
        run: |
          if [ -d ".build/vscode-reh-darwin-x64" ]; then
            tar -czf "dist/loophole-reh-darwin-x64-$VERSION.tar.gz" -C ".build" "vscode-reh-darwin-x64"
          fi

      - name: Build Web Host
        run: npm run gulp vscode-reh-web-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Web Host
        run: |
          if [ -d ".build/vscode-reh-web-darwin-x64" ]; then
            tar -czf "dist/loophole-reh-web-darwin-x64-$VERSION.tar.gz" -C ".build" "vscode-reh-web-darwin-x64"
          fi

      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/x86_64-apple-darwin/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli && cp "$cli_bin" .tmp-cli/loophole
            tar -czf "dist/loophole-cli-darwin-x64-$VERSION.tar.gz" -C ".tmp-cli" loophole
          fi

      - name: Upload release assets (macOS x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            echo "Uploading $f..."
            gh release upload "$VERSION" "$f" --clobber
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS ARM64 (Apple Silicon)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-upload-macos-arm64:
