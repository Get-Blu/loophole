name: CI Build — macOS

on:
  pull_request:
    branches:
      - code
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.121.03429) — defaults to package.json'
        required: false

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve version
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: macOS x64 (Intel)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-x64:
    name: Build macOS x64 (Intel)
    needs: resolve-version
    runs-on: macos-13        # macos-13 = Intel x64
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Toolchain ─────────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      # ── Caches ────────────────────────────────────────────────────────────────
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: macos-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: macos-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: macos-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-x64-electron-

      # ── Install & compile ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64


      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-apple-darwin

      # ── Package base app ───────────────────────────────────────────────────────
      - name: Package Electron app (darwin x64)
        run: npm run gulp vscode-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      # ── 1. DMG ────────────────────────────────────────────────────────────────
      - name: Build DMG
        run: npm run gulp vscode-darwin-x64-ci
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — DMG
        run: |
          src=$(find .build -name "*.dmg" | head -1)
          cp "$src" "dist/Loophole.x64.$VERSION.dmg"

      # ── 2. ZIP ────────────────────────────────────────────────────────────────
      - name: Build ZIP
        run: npm run gulp vscode-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — ZIP
        run: |
          src=$(find .build -name "VSCode-darwin-x64-*.zip" | head -1)
          cp "$src" "dist/Loophole-darwin-x64-$VERSION.zip"

      # ── 3. Remote Host tarball ─────────────────────────────────────────────────
      - name: Build Remote Host
        run: npm run gulp vscode-reh-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Remote Host
        run: |
          if [ -d ".build/vscode-reh-darwin-x64" ]; then
            tar -czf "dist/loophole-reh-darwin-x64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-darwin-x64"
          else
            echo "::warning::REH directory not found — skipping"
          fi

      # ── 4. Web Host tarball ────────────────────────────────────────────────────
      - name: Build Web Host
        run: npm run gulp vscode-reh-web-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Web Host
        run: |
          if [ -d ".build/vscode-reh-web-darwin-x64" ]; then
            tar -czf "dist/loophole-reh-web-darwin-x64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-web-darwin-x64"
          else
            echo "::warning::REH-Web directory not found — skipping"
          fi

      # ── 5. CLI tarball ─────────────────────────────────────────────────────────
      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/x86_64-apple-darwin/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli
            cp "$cli_bin" .tmp-cli/loophole
            tar -czf "dist/loophole-cli-darwin-x64-$VERSION.tar.gz" \
              -C ".tmp-cli" loophole
          else
            echo "::warning::CLI binary not found — skipping"
          fi

      # ── Summary & upload ───────────────────────────────────────────────────────
      - name: List built artifacts
        run: |
          echo "=== dist/ artifacts ==="
          ls -lh dist/

      - name: Upload — DMG
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-x64-${{ env.VERSION }}-dmg
          path: dist/Loophole.x64.${{ env.VERSION }}.dmg
          retention-days: 7

      - name: Upload — ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-x64-${{ env.VERSION }}-zip
          path: dist/Loophole-darwin-x64-${{ env.VERSION }}.zip
          retention-days: 7

      - name: Upload — Remote Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-darwin-x64-${{ env.VERSION }}
          path: dist/loophole-reh-darwin-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Web Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-web-darwin-x64-${{ env.VERSION }}
          path: dist/loophole-reh-web-darwin-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — CLI
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-darwin-x64-${{ env.VERSION }}
          path: dist/loophole-cli-darwin-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: macOS ARM64 (Apple Silicon)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon)
    needs: resolve-version
    runs-on: macos-14        # macos-14 = Apple Silicon arm64
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Toolchain ─────────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # ── Caches ────────────────────────────────────────────────────────────────
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: macos-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: macos-arm64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: macos-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-arm64-electron-

      # ── Install & compile ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: arm64


      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-apple-darwin

      # ── Package base app ───────────────────────────────────────────────────────
      - name: Package Electron app (darwin arm64)
        run: npm run gulp vscode-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      # ── 1. DMG ────────────────────────────────────────────────────────────────
      - name: Build DMG
        run: npm run gulp vscode-darwin-arm64-ci
        env:
          LOOPHOLE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — DMG
        run: |
          src=$(find .build -name "*.dmg" | head -1)
          cp "$src" "dist/Loophole.arm64.$VERSION.dmg"

      # ── 2. ZIP ────────────────────────────────────────────────────────────────
      - name: Build ZIP
        run: npm run gulp vscode-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — ZIP
        run: |
          src=$(find .build -name "VSCode-darwin-arm64-*.zip" | head -1)
          cp "$src" "dist/Loophole-darwin-arm64-$VERSION.zip"

      # ── 3. Remote Host tarball ─────────────────────────────────────────────────
      - name: Build Remote Host
        run: npm run gulp vscode-reh-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Remote Host
        run: |
          if [ -d ".build/vscode-reh-darwin-arm64" ]; then
            tar -czf "dist/loophole-reh-darwin-arm64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-darwin-arm64"
          else
            echo "::warning::REH directory not found — skipping"
          fi

      # ── 4. Web Host tarball ────────────────────────────────────────────────────
      - name: Build Web Host
        run: npm run gulp vscode-reh-web-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Web Host
        run: |
          if [ -d ".build/vscode-reh-web-darwin-arm64" ]; then
            tar -czf "dist/loophole-reh-web-darwin-arm64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-web-darwin-arm64"
          else
            echo "::warning::REH-Web directory not found — skipping"
          fi

      # ── 5. CLI tarball ─────────────────────────────────────────────────────────
      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/aarch64-apple-darwin/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli
            cp "$cli_bin" .tmp-cli/loophole
            tar -czf "dist/loophole-cli-darwin-arm64-$VERSION.tar.gz" \
              -C ".tmp-cli" loophole
          else
            echo "::warning::CLI binary not found — skipping"
          fi

      # ── Summary & upload ───────────────────────────────────────────────────────
      - name: List built artifacts
        run: |
          echo "=== dist/ artifacts ==="
          ls -lh dist/

      - name: Upload — DMG
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-arm64-${{ env.VERSION }}-dmg
