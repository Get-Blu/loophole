name: Generate Lockfile

on:
  workflow_dispatch:

jobs:
  generate-lockfile:
    name: Generate package-lock.json
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Terminal issue
      # Only update the lock file — do NOT actually install native modules here.
      # If we do a full `npm install` without the Electron rebuild steps, node-pty
      # gets locked to a plain Node.js prebuilt, which breaks the terminal (error 193).
      - name: Update lock file only (no native install)
        run: npm install --package-lock-only --ignore-scripts
        env:
          npm_config_arch: x64

      - name: Commit updated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "chore: regenerate package-lock.json"
          git push
