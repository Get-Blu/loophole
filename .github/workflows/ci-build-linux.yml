name: CI Build — Linux

on:
  pull_request:
    branches:
      - code
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.121.03429) — defaults to package.json'
        required: false
      upload_to_gofile:
        description: 'Upload artifacts to Gofile.io for faster download?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Fast PR check — compiles only. Does NOT build installers/packages.
  # The full multi-platform release pipeline below only runs on manual dispatch,
  # since it produces 9+ artifact types across 4 jobs and is too expensive to
  # run on every PR.
  # ─────────────────────────────────────────────────────────────────────────────
  pr-check:
    name: PR Compile Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev pkg-config

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve version — only needed for the real release builds
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Linux x64
  # Produces: .deb, .rpm, .tar.gz, AppImage (+.zsync), .snap, reh, reh-web, CLI
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── System dependencies ────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libkrb5-dev \
            fakeroot \
            rpm \
            squashfs-tools \
            zsync \
            file \
            python3-pip \
            pkg-config \
            libgtk-3-dev \
            libnss3-dev \
            libgbm-dev \
            libasound2-dev

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
        continue-on-error: true

      - name: Install appimagetool
        run: |
          curl -sL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool

      # ── Toolchain ─────────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # ── Caches ────────────────────────────────────────────────────────────────
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: linux-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: linux-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: linux-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-x64-electron-

      # ── Install & compile ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-unknown-linux-gnu

      # ── Package base app (single call — reused for tar.gz + AppImage) ─────────
      - name: Package Electron app (linux x64)
        run: npm run gulp vscode-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      # ── 1. .deb ───────────────────────────────────────────────────────────────
      - name: Build .deb package
        run: npm run gulp vscode-linux-x64-build-deb
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — .deb
        run: |
          src=$(find .build -name "*.deb" | head -1)
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "dist/loophole_${VERSION}_amd64.deb"
            echo "Staged: $src"
          else
            echo "::warning::No .deb produced — skipping"
          fi

      # ── 2. .rpm ───────────────────────────────────────────────────────────────
      - name: Build .rpm package
        run: npm run gulp vscode-linux-x64-build-rpm
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — .rpm
        run: |
          src=$(find .build -name "*.rpm" | head -1)
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "dist/loophole-${VERSION}-el8.x86_64.rpm"
            echo "Staged: $src"
          else
            echo "::warning::No .rpm produced — skipping"
          fi

      # ── 3. .tar.gz archive (reuses the package already built above — no rebuild) ─
      - name: Stage — tar.gz
        run: |
          src=$(find .build -name "VSCode-linux-x64-*.tar.gz" | head -1)
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "dist/Loophole-linux-x64-$VERSION.tar.gz"
            echo "Staged: $src"
          else
            # Build system may not emit a tarball directly — pack the unpacked dir ourselves
            app_dir=$(find .build -maxdepth 2 -type d -name "VSCode-linux-x64" | head -1)
            if [ -n "$app_dir" ]; then
              tar -czf "dist/Loophole-linux-x64-$VERSION.tar.gz" -C "$(dirname "$app_dir")" "$(basename "$app_dir")"
              echo "Packed tar.gz from $app_dir"
            else
              echo "::warning::No unpacked app directory found — skipping tar.gz"
            fi
          fi

      # ── 4. AppImage (built manually — gulp does not produce one) ──────────────
      - name: Build AppImage
        run: |
          set -e
          APP_DIR=$(find .build -maxdepth 2 -type d -name "VSCode-linux-x64" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::warning::No unpacked app directory found — skipping AppImage"
            exit 0
          fi

          mkdir -p .appimage/AppDir/usr/bin
          cp -r "$APP_DIR"/* .appimage/AppDir/usr/bin/

          ICON_SRC=$(find resources -iname "code.png" 2>/dev/null | head -1)
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" .appimage/AppDir/loophole.png
          else
            echo "::warning::No app icon found at resources/ — AppImage will use a placeholder"
            touch .appimage/AppDir/loophole.png
          fi

          cat > .appimage/AppDir/loophole.desktop <<EOF
          [Desktop Entry]
          Name=Loophole
          Exec=usr/bin/bin/code %F
          Icon=loophole
          Type=Application
          Categories=Development;
          EOF

          cat > .appimage/AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/bin/code" "$@"
          EOF
          chmod +x .appimage/AppDir/AppRun

          GLIBC=$(ldd --version | head -1 | grep -oP '\d+\.\d+$' || echo "2.30")
          ARCH=x86_64 appimagetool .appimage/AppDir "dist/Loophole-$VERSION.glibc${GLIBC}-x86_64.AppImage"

      - name: Stage — AppImage .zsync
        run: |
          appimage=$(find dist -name "*.AppImage" | head -1)
          if [ -n "$appimage" ]; then
            zsyncmake -o "${appimage}.zsync" "$appimage" || echo "::warning::zsyncmake failed — skipping .zsync"
          else
            echo "::warning::No AppImage found — skipping .zsync"
          fi

      # ── 5. Snap ───────────────────────────────────────────────────────────────
      - name: Build Snap package
        run: npm run gulp vscode-linux-x64-build-snap
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        continue-on-error: true

      - name: Stage — Snap
        run: |
          src=$(find .build -name "*.snap" | head -1)
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "dist/loophole_${VERSION}_amd64.snap"
            echo "Staged: $src"
          else
            echo "::warning::Snap not found — skipping"
          fi

      # ── 6. Remote Host tarball ─────────────────────────────────────────────────
      - name: Build Remote Host
        run: npm run gulp vscode-reh-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Remote Host
        run: |
          if [ -d ".build/vscode-reh-linux-x64" ]; then
            tar -czf "dist/loophole-reh-linux-x64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-linux-x64"
          else
            echo "::warning::REH directory not found — skipping"
          fi

      # ── 7. Web Host tarball ────────────────────────────────────────────────────
      - name: Build Web Host
        run: npm run gulp vscode-reh-web-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Web Host
        run: |
          if [ -d ".build/vscode-reh-web-linux-x64" ]; then
            tar -czf "dist/loophole-reh-web-linux-x64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-web-linux-x64"
          else
            echo "::warning::REH-Web directory not found — skipping"
          fi

      # ── 8. CLI tarball ─────────────────────────────────────────────────────────
      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/x86_64-unknown-linux-gnu/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli
            cp "$cli_bin" .tmp-cli/loophole
            tar -czf "dist/loophole-cli-linux-x64-$VERSION.tar.gz" \
              -C ".tmp-cli" loophole
          else
            echo "::warning::CLI binary not found — skipping"
          fi

      # ── Summary & upload ───────────────────────────────────────────────────────
      - name: List built artifacts
        run: |
          echo "=== dist/ artifacts ==="
          ls -lh dist/ || echo "(dist/ is empty)"

      - name: Upload — .deb
        uses: actions/upload-artifact@v4
        with:
          name: loophole-linux-x64-${{ env.VERSION }}-deb
          path: dist/loophole_${{ env.VERSION }}_amd64.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — .rpm
        uses: actions/upload-artifact@v4
        with:
          name: loophole-linux-x64-${{ env.VERSION }}-rpm
          path: dist/loophole-${{ env.VERSION }}-el8.x86_64.rpm
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-linux-x64-${{ env.VERSION }}-targz
          path: dist/Loophole-linux-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — AppImage + zsync
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-linux-x64-${{ env.VERSION }}-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Snap
        uses: actions/upload-artifact@v4
        with:
          name: loophole-linux-x64-${{ env.VERSION }}-snap
          path: dist/loophole_${{ env.VERSION }}_amd64.snap
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Remote Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-linux-x64-${{ env.VERSION }}
          path: dist/loophole-reh-linux-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Web Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-web-linux-x64-${{ env.VERSION }}
          path: dist/loophole-reh-web-linux-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — CLI
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-linux-x64-${{ env.VERSION }}
          path: dist/loophole-cli-linux-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      # ── Upload to Gofile.io (optional) ────────────────────────────────────────
      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        shell: bash
        run: |
          echo "======================================"
          echo "  Uploading artifacts to Gofile.io"
          echo "======================================"

          # Get best available server
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])")
          echo "Using server: $SERVER"

          for FILE in dist/*.{deb,rpm,tar.gz,AppImage,zsync,snap}; do
            if [ -f "$FILE" ]; then
              FILENAME=$(basename "$FILE")
              echo ""
              echo "Uploading: $FILENAME"
              RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
              echo "Response: $RESPONSE"
              LINK=$(echo $RESPONSE | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['downloadPage'])")
              echo " $FILENAME → $LINK"
            fi
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Linux ARM64
  # Produces: .deb, .rpm, .tar.gz, reh, reh-web, CLI
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux ARM64
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libkrb5-dev \
            fakeroot \
            rpm \
            python3-pip \
            pkg-config \
            libgtk-3-dev \
            libnss3-dev \
            libgbm-dev \
            libasound2-dev

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: linux-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: linux-arm64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: linux-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-arm64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: arm64

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package Electron app (linux arm64)
        run: npm run gulp vscode-linux-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      # ── 1. .deb ───────────────────────────────────────────────────────────────
      - name: Build .deb package
        run: npm run gulp vscode-linux-arm64-build-deb
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — .deb
        run: |
          src=$(find .build -name "*.deb" | head -1)
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "dist/loophole_${VERSION}_arm64.deb"
          else
            echo "::warning::No .deb produced — skipping"
          fi

      # ── 2. .rpm ───────────────────────────────────────────────────────────────
      - name: Build .rpm package
        run: npm run gulp vscode-linux-arm64-build-rpm
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — .rpm
        run: |
          src=$(find .build -name "*.rpm" | head -1)
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "dist/loophole-${VERSION}-el8.aarch64.rpm"
          else
            echo "::warning::No .rpm produced — skipping"
          fi

      # ── 3. tar.gz archive (reuses the package already built — no rebuild) ─────
      - name: Stage — tar.gz
        run: |
          src=$(find .build -name "VSCode-linux-arm64-*.tar.gz" | head -1)
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "dist/Loophole-linux-arm64-$VERSION.tar.gz"
          else
            app_dir=$(find .build -maxdepth 2 -type d -name "VSCode-linux-arm64" | head -1)
            if [ -n "$app_dir" ]; then
              tar -czf "dist/Loophole-linux-arm64-$VERSION.tar.gz" -C "$(dirname "$app_dir")" "$(basename "$app_dir")"
            else
              echo "::warning::No unpacked app directory found — skipping tar.gz"
            fi
          fi

      # ── 4. Remote Host tarball ─────────────────────────────────────────────────
      - name: Build Remote Host
        run: npm run gulp vscode-reh-linux-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Remote Host
        run: |
          if [ -d ".build/vscode-reh-linux-arm64" ]; then
            tar -czf "dist/loophole-reh-linux-arm64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-linux-arm64"
          else
            echo "::warning::REH directory not found — skipping"
          fi

      # ── 5. Web Host tarball ────────────────────────────────────────────────────
      - name: Build Web Host
        run: npm run gulp vscode-reh-web-linux-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — Web Host
        run: |
          if [ -d ".build/vscode-reh-web-linux-arm64" ]; then
            tar -czf "dist/loophole-reh-web-linux-arm64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-web-linux-arm64"
          else
            echo "::warning::REH-Web directory not found — skipping"
          fi

      # ── 6. CLI tarball ─────────────────────────────────────────────────────────
      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/aarch64-unknown-linux-gnu/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli
            cp "$cli_bin" .tmp-cli/loophole
            tar -czf "dist/loophole-cli-linux-arm64-$VERSION.tar.gz" \
              -C ".tmp-cli" loophole
          else
            echo "::warning::CLI binary not found — skipping"
          fi

      - name: List built artifacts
        run: |
          echo "=== dist/ artifacts ==="
          ls -lh dist/ || echo "(dist/ is empty)"

      - name: Upload — .deb
        uses: actions/upload-artifact@v4
        with:
          name: loophole-linux-arm64-${{ env.VERSION }}-deb
          path: dist/loophole_${{ env.VERSION }}_arm64.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — .rpm
        uses: actions/upload-artifact@v4
        with:
          name: loophole-linux-arm64-${{ env.VERSION }}-rpm
          path: dist/loophole-${{ env.VERSION }}-el8.aarch64.rpm
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-linux-arm64-${{ env.VERSION }}-targz
          path: dist/Loophole-linux-arm64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Remote Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-linux-arm64-${{ env.VERSION }}
          path: dist/loophole-reh-linux-arm64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Web Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-web-linux-arm64-${{ env.VERSION }}
          path: dist/loophole-reh-web-linux-arm64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — CLI
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-linux-arm64-${{ env.VERSION }}
          path: dist/loophole-cli-linux-arm64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      # ── Upload to Gofile.io (optional) ────────────────────────────────────────
      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        shell: bash
        run: |
          echo "======================================"
          echo "  Uploading artifacts to Gofile.io"
          echo "======================================"

          # Get best available server
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])")
          echo "Using server: $SERVER"

          for FILE in dist/*.{deb,rpm,tar.gz,AppImage,zsync,snap}; do
            if [ -f "$FILE" ]; then
              FILENAME=$(basename "$FILE")
              echo ""
              echo "Uploading: $FILENAME"
              RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
              echo "Response: $RESPONSE"
