  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Alpine x64 (musl libc) — REH + REH-Web only
  # Alpine doesn't support the full Electron app, only server/remote hosts
  # ─────────────────────────────────────────────────────────────────────────────
  build-alpine-x64:
    name: Build Alpine x64 (musl)
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Alpine REH artifacts in Docker (musl)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --platform linux/amd64 \
            -e NODE_OPTIONS="--max-old-space-size=8192" \
            node:22-alpine sh -c "
              set -e

              apk add --no-cache \
                bash curl git python3 py3-pip make gcc g++ \
                libx11-dev libxkbfile-dev libsecret-dev krb5-dev \
                musl-dev pkgconfig

              curl https://sh.rustup.rs -sSf | sh -s -- -y --target x86_64-unknown-linux-musl
              export PATH=\"\$HOME/.cargo/bin:\$PATH\"

              npm ci
              npm run buildreact
              npm run compile

              cd cli
              cargo build --release --target x86_64-unknown-linux-musl
              cd ..

              npm run gulp vscode-reh-linux-x64-ci
              npm run gulp vscode-reh-web-linux-x64-ci
            "

      - name: Create dist directory
        run: mkdir -p dist

      - name: Stage — Remote Host (Alpine x64)
        run: |
          if [ -d ".build/vscode-reh-linux-x64" ]; then
            tar -czf "dist/loophole-reh-alpine-x64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-linux-x64"
          else
            echo "::warning::Alpine REH directory not found — skipping"
          fi

      - name: Stage — Web Host (Alpine x64)
        run: |
          if [ -d ".build/vscode-reh-web-linux-x64" ]; then
            tar -czf "dist/loophole-reh-web-alpine-x64-$VERSION.tar.gz" \
              -C ".build" "vscode-reh-web-linux-x64"
          else
            echo "::warning::Alpine REH-Web directory not found — skipping"
          fi

      - name: List built artifacts
        run: |
          echo "=== dist/ artifacts ==="
          ls -lh dist/ || echo "(dist/ is empty)"

      - name: Upload — Remote Host (Alpine x64)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-alpine-x64-${{ env.VERSION }}
          path: dist/loophole-reh-alpine-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Web Host (Alpine x64)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-web-alpine-x64-${{ env.VERSION }}
          path: dist/loophole-reh-web-alpine-x64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      # ── Upload to Gofile.io (optional) ────────────────────────────────────────
      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        shell: bash
        run: |
          echo "======================================"
          echo "  Uploading artifacts to Gofile.io"
          echo "======================================"

          # Get best available server
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])")
          echo "Using server: $SERVER"

          for FILE in dist/*.{deb,rpm,tar.gz,AppImage,zsync,snap}; do
            if [ -f "$FILE" ]; then
              FILENAME=$(basename "$FILE")
              echo ""
              echo "Uploading: $FILENAME"
              RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
              echo "Response: $RESPONSE"
              LINK=$(echo $RESPONSE | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['downloadPage'])")
              echo " $FILENAME → $LINK"
            fi
          done

