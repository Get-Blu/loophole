name: Strip Copilot & Generate Patch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - show what would be deleted without deleting'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  strip-copilot:
    name: Strip All Copilot & Generate Patch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "Loophole Bot"
          git config user.email "bot@loophole.ai"

      - name: Create strip branch
        run: |
          git checkout -b strip/remove-copilot-$(date +%Y%m%d%H%M%S)

      - name: Strip Copilot - Delete all copilot folders and files
        run: |
          echo "=== Removing all Copilot folders and files ==="

          FOLDERS=(
            "extensions/copilot"
            "src/vs/platform/agentHost/node/copilot"
            "src/vs/sessions/contrib/copilotChatSessions"
          )

          FILES=(
            "extensions/typescript-language-features/src/languageFeatures/util/copilot.ts"
            "extensions/terminal-suggest/src/completions/copilot.ts"
            "src/vs/sessions/copilot-customizations-spec.md"
            "src/vs/workbench/contrib/chat/common/promptSyntax/hookCopilotCliCompat.ts"
          )

          for FOLDER in "${FOLDERS[@]}"; do
            if [ -d "$FOLDER" ]; then
              if [ "${{ inputs.dry_run }}" == "true" ]; then
                COUNT=$(find "$FOLDER" -type f | wc -l)
                echo "[DRY RUN] Would delete folder: $FOLDER ($COUNT files)"
              else
                rm -rf "$FOLDER"
                echo "✅ Deleted folder: $FOLDER"
              fi
            else
              echo "⚠️  Not found (skipping): $FOLDER"
            fi
          done

          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              if [ "${{ inputs.dry_run }}" == "true" ]; then
                echo "[DRY RUN] Would delete file: $FILE"
              else
                rm -f "$FILE"
                echo "✅ Deleted file: $FILE"
              fi
            else
              echo "⚠️  Not found (skipping): $FILE"
            fi
          done

      - name: Strip Copilot - Remove copilot imports from source files
        if: inputs.dry_run == 'false'
        run: |
          echo "=== Removing copilot import lines from source files ==="

          find src/ extensions/ -type f \( -name "*.ts" -o -name "*.js" \) | while read FILE; do
            if grep -q "copilot" "$FILE" 2>/dev/null; then
              sed -i "/from '.*\/copilot'/d" "$FILE"
              sed -i '/from ".*\/copilot"/d' "$FILE"
              sed -i '/import.*[Cc]opilot.*from/d' "$FILE"
              sed -i '/copilotChatSessions/d' "$FILE"
              sed -i '/hookCopilotCliCompat/d' "$FILE"
            fi
          done

          echo "✅ Done cleaning imports"

      - name: Strip Copilot - Remove from build config
        if: inputs.dry_run == 'false'
        run: |
          echo "=== Cleaning build config ==="

          if [ -f "build/npm/dirs.js" ]; then
            sed -i "/'extensions\/copilot'/d" build/npm/dirs.js
            sed -i '/"extensions\/copilot"/d' build/npm/dirs.js
            echo "✅ Cleaned build/npm/dirs.js"
          else
            echo "⚠️  build/npm/dirs.js not found"
          fi

          if [ -f "build/gulpfile.extensions.js" ]; then
            sed -i "/'copilot'/d" build/gulpfile.extensions.js
            sed -i '/"copilot"/d' build/gulpfile.extensions.js
            echo "✅ Cleaned build/gulpfile.extensions.js"
          else
            echo "⚠️  build/gulpfile.extensions.js not found"
          fi

      - name: Verify removal
        run: |
          echo ""
          echo "=== Verification ==="
          echo ""

          FOLDERS=(
            "extensions/copilot"
            "src/vs/platform/agentHost/node/copilot"
            "src/vs/sessions/contrib/copilotChatSessions"
          )

          FILES=(
            "extensions/typescript-language-features/src/languageFeatures/util/copilot.ts"
            "extensions/terminal-suggest/src/completions/copilot.ts"
            "src/vs/sessions/copilot-customizations-spec.md"
            "src/vs/workbench/contrib/chat/common/promptSyntax/hookCopilotCliCompat.ts"
          )

          ALL_GOOD=true

          echo "Folders:"
          for FOLDER in "${FOLDERS[@]}"; do
            if [ -d "$FOLDER" ]; then
              echo "  ❌ STILL EXISTS: $FOLDER"
              ALL_GOOD=false
            else
              echo "  ✅ Gone: $FOLDER"
            fi
          done

          echo ""
          echo "Files:"
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "  ❌ STILL EXISTS: $FILE"
              ALL_GOOD=false
            else
              echo "  ✅ Gone: $FILE"
            fi
          done

          echo ""
          echo "Remaining files that mention copilot (just references, not actual code):"
          grep -r "copilot" --include="*.ts" --include="*.js" -l src/ extensions/ 2>/dev/null | grep -v node_modules | wc -l | xargs echo "  Count:"

          echo ""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "ℹ️  DRY RUN — nothing was actually deleted"
          elif [ "$ALL_GOOD" == "true" ]; then
            echo "🎉 All Copilot folders and files are gone!"
          else
            echo "⚠️  Some items still exist — check above"
          fi

      - name: Commit changes
        if: inputs.dry_run == 'false'
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "⚠️  No changes to commit"
          else
            git commit -m "chore: strip all GitHub Copilot from Loophole"
            echo "✅ Changes committed"
          fi

      - name: Generate patch file
        if: inputs.dry_run == 'false'
        run: |
          echo "=== Generating patch file ==="
          mkdir -p patches
          git format-patch HEAD~1 --stdout > patches/remove-copilot.patch
          SIZE=$(wc -l < patches/remove-copilot.patch)
          echo "✅ Patch saved to patches/remove-copilot.patch ($SIZE lines)"

      - name: Commit patch file
        if: inputs.dry_run == 'false'
        run: |
          git add patches/remove-copilot.patch
          if git diff --staged --quiet; then
            echo "⚠️  No patch to commit"
          else
            git commit -m "chore: add remove-copilot.patch for future upstreaming"
            echo "✅ Patch committed"
          fi

      - name: Push branch
        if: inputs.dry_run == 'false'
        run: |
          git push origin HEAD
          echo "✅ Branch pushed"

      - name: Create Pull Request
        if: inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: strip all GitHub Copilot from Loophole" \
            --body "## Removes all GitHub Copilot from Loophole IDE

          ### Deleted folders:
          - \`extensions/copilot\` — entire Copilot extension (3500+ files)
          - \`src/vs/platform/agentHost/node/copilot\` — core copilot agent
          - \`src/vs/sessions/contrib/copilotChatSessions\` — copilot chat sessions

          ### Deleted files:
          - \`extensions/typescript-language-features/.../copilot.ts\`
          - \`extensions/terminal-suggest/.../copilot.ts\`
          - \`src/vs/sessions/copilot-customizations-spec.md\`
          - \`src/vs/workbench/contrib/chat/common/promptSyntax/hookCopilotCliCompat.ts\`

          ### Also cleaned:
          - All copilot import lines from source files
          - Build config references

          ### For future upstreaming:
          A \`patches/remove-copilot.patch\` file is included.
          When a new VSCode version is released, just run:
          \`\`\`bash
          git apply patches/remove-copilot.patch
          \`\`\`" \
            --base master \
            --head $(git branch --show-current)

      - name: Upload patch as artifact
        if: inputs.dry_run == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: remove-copilot-patch
          path: patches/remove-copilot.patch
