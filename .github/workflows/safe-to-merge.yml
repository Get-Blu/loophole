name: Safe to Merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to post the bot comment on'
        required: true
        type: string
      simulate:
        description: 'Simulate which result?'
        required: true
        default: 'all_green'
        type: choice
        options:
          - all_green
          - failed
  workflow_run:
    workflows:
      - "Loophole IDE"
      - "CI Build \u2014 Linux"
    types:
      - completed

permissions:
  pull-requests: write
  statuses: read
  checks: read

jobs:
  notify:
    name: Notify Safe to Merge
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      )

    steps:

      # ── MANUAL TEST PATH ──────────────────────────────────────────────────────
      - name: Post test comment (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          SIMULATE: ${{ github.event.inputs.simulate }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const simulate = process.env.SIMULATE;

            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const c of existing.data) {
              if (c.user.type === 'Bot' && c.body.includes('<!-- loophole-safe-to-merge -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            const greenBody = [
              '<!-- loophole-safe-to-merge -->',
              '## \u2705 Safe to Merge',
              '',
              'All CI checks passed \u2014 **you can blindly merge this PR**.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Compile & Hygiene | \u2705 Passed |',
              '| Linux (Electron / Browser / Remote) | \u2705 Passed |',
              '| macOS (Electron / Browser / Remote) | \u2705 Passed |',
              '| Windows (Electron / Browser / Remote) | \u2705 Passed |',
              '| Linux PR Compile Check | \u2705 Passed |',
              '',
              '> _This comment is posted automatically when all required workflows go green._',
            ].join('\n');

            const redBody = [
              '<!-- loophole-safe-to-merge -->',
              '## \u274c Do NOT Merge',
              '',
              'One or more CI checks failed \u2014 **do not merge this PR**.',
              '',
              '**Failed checks:** Compile & Hygiene, Linux Electron',
              '',
              'Fix the failures above before merging.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: simulate === 'all_green' ? greenBody : redBody,
            });
            console.log('Posted ' + simulate + ' comment on PR #' + prNumber);

      # ── AUTOMATIC PATH ────────────────────────────────────────────────────────
      - name: Get PR number from workflow run
        if: github.event_name == 'workflow_run'
        id: getpr
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 20,
            });
            const pr = prs.data.find(p => p.head.sha === headSha);
            if (!pr) { console.log('No open PR for SHA:', headSha); return; }
            core.setOutput('pr_number', String(pr.number));

      - name: Check all required checks on PR
        if: github.event_name == 'workflow_run' && steps.getpr.outputs.pr_number != ''
        id: checkall
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.getpr.outputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const sha = pr.data.head.sha;
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });
            const runs = checks.data.check_runs;
            const failed  = runs.filter(r => r.conclusion === 'failure' || r.conclusion === 'cancelled');
            const pending = runs.filter(r => r.status !== 'completed');
            if (failed.length > 0) {
              core.setOutput('status', 'failed');
              core.setOutput('failed_checks', failed.map(r => r.name).join(', '));
            } else if (pending.length > 0) {
              core.setOutput('status', 'pending');
            } else {
              core.setOutput('status', 'all_green');
            }

      - name: Post Safe to Merge comment
        if: github.event_name == 'workflow_run' && steps.checkall.outputs.status == 'all_green'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.getpr.outputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const c of existing.data) {
              if (c.user.type === 'Bot' && c.body.includes('<!-- loophole-safe-to-merge -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            const body = [
              '<!-- loophole-safe-to-merge -->',
              '## \u2705 Safe to Merge',
              '',
              'All CI checks passed \u2014 **you can blindly merge this PR**.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Compile & Hygiene | \u2705 Passed |',
              '| Linux (Electron / Browser / Remote) | \u2705 Passed |',
              '| macOS (Electron / Browser / Remote) | \u2705 Passed |',
              '| Windows (Electron / Browser / Remote) | \u2705 Passed |',
              '| Linux PR Compile Check | \u2705 Passed |',
              '',
              '> _This comment is posted automatically when all required workflows go green._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Post Do Not Merge comment
        if: github.event_name == 'workflow_run' && steps.checkall.outputs.status == 'failed'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.getpr.outputs.pr_number }}
          FAILED_CHECKS: ${{ steps.checkall.outputs.failed_checks }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const failedChecks = process.env.FAILED_CHECKS;
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const c of existing.data) {
              if (c.user.type === 'Bot' && c.body.includes('<!-- loophole-safe-to-merge -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            const body = [
              '<!-- loophole-safe-to-merge -->',
              '## \u274c Do NOT Merge',
              '',
              'One or more CI checks failed \u2014 **do not merge this PR**.',
              '',
              '**Failed checks:** ' + failedChecks,
              '',
              'Fix the failures above before merging.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
