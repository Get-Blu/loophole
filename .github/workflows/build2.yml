name: Build Loophole

on:
  push:
    branches: [ "clean/vscode-1.116" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: loophole-build
          path: out/
