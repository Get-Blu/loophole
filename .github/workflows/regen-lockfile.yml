name: Regenerate package-lock.json

on:
  workflow_dispatch: # run manually from GitHub Actions tab

jobs:
  regen-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Delete old lock file
        run: rm -f package-lock.json

      - name: Run npm install (triggers postinstall for all extensions)
        run: npm install
        env:
          npm_config_arch: x64

      - name: Commit and push regenerated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "fix: regenerate package-lock.json with full postinstall"
          git push