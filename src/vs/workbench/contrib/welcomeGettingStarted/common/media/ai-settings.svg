<svg width="300" height="220" viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">

	<!-- ===== Light theme ===== -->
	<g class="vscode-light">
		<!-- outer frame -->
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#3C3C3C" stroke-opacity="0.3" stroke-width="1.5"/>

		<!-- row 1: model dropdown -->
		<rect x="36" y="48" width="208" height="24" rx="6" fill="none" stroke="#3C3C3C" stroke-opacity="0.4" stroke-width="1.5"/>
		<rect x="46" y="56" width="90" height="4" rx="2" fill="#3C3C3C" fill-opacity="0.4"/>
		<path d="M226 56 L232 62 L238 56" stroke="#3C3C3C" stroke-opacity="0.55" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

		<!-- row 2: toggles -->
		<rect x="36" y="94" width="36" height="20" rx="10" fill="#0F6E56" fill-opacity="0.85"/>
		<circle cx="64" cy="104" r="8" fill="#FFFFFF"/>

		<rect x="110" y="94" width="36" height="20" rx="10" fill="none" stroke="#3C3C3C" stroke-opacity="0.4" stroke-width="1.5"/>
		<circle cx="118" cy="104" r="8" fill="#3C3C3C" fill-opacity="0.4"/>

		<rect x="184" y="94" width="36" height="20" rx="10" fill="none" stroke="#3C3C3C" stroke-opacity="0.4" stroke-width="1.5"/>
		<circle cx="192" cy="104" r="8" fill="#3C3C3C" fill-opacity="0.4"/>

		<!-- row 3: context window slider -->
		<line x1="36" y1="148" x2="244" y2="148" stroke="#3C3C3C" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
		<line x1="36" y1="148" x2="150" y2="148" stroke="#0F6E56" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
		<circle cx="150" cy="148" r="8" fill="#0F6E56" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
	</g>

	<!-- ===== Dark theme ===== -->
	<g class="vscode-dark">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#CCCCCC" stroke-opacity="0.3" stroke-width="1.5"/>

		<rect x="36" y="48" width="208" height="24" rx="6" fill="none" stroke="#CCCCCC" stroke-opacity="0.4" stroke-width="1.5"/>
		<rect x="46" y="56" width="90" height="4" rx="2" fill="#CCCCCC" fill-opacity="0.45"/>
		<path d="M226 56 L232 62 L238 56" stroke="#CCCCCC" stroke-opacity="0.6" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

		<rect x="36" y="94" width="36" height="20" rx="10" fill="#5DCAA5" fill-opacity="0.9"/>
		<circle cx="64" cy="104" r="8" fill="#1E1E1E"/>

		<rect x="110" y="94" width="36" height="20" rx="10" fill="none" stroke="#CCCCCC" stroke-opacity="0.4" stroke-width="1.5"/>
		<circle cx="118" cy="104" r="8" fill="#CCCCCC" fill-opacity="0.4"/>

		<rect x="184" y="94" width="36" height="20" rx="10" fill="none" stroke="#CCCCCC" stroke-opacity="0.4" stroke-width="1.5"/>
		<circle cx="192" cy="104" r="8" fill="#CCCCCC" fill-opacity="0.4"/>

		<line x1="36" y1="148" x2="244" y2="148" stroke="#CCCCCC" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
		<line x1="36" y1="148" x2="150" y2="148" stroke="#5DCAA5" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>
		<circle cx="150" cy="148" r="8" fill="#5DCAA5" fill-opacity="0.9" stroke="#1E1E1E" stroke-width="2"/>
	</g>

	<!-- ===== High contrast theme ===== -->
	<g class="vscode-high-contrast">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>

		<rect x="36" y="48" width="208" height="24" rx="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<rect x="46" y="56" width="90" height="4" fill="#FFFFFF"/>
		<path d="M226 56 L232 62 L238 56" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

		<rect x="36" y="94" width="36" height="20" rx="10" fill="#FFFFFF"/>
		<circle cx="64" cy="104" r="8" fill="#000000"/>

		<rect x="110" y="94" width="36" height="20" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<circle cx="118" cy="104" r="8" fill="#FFFFFF"/>

		<rect x="184" y="94" width="36" height="20" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<circle cx="192" cy="104" r="8" fill="#FFFFFF"/>

		<line x1="36" y1="148" x2="244" y2="148" stroke="#FFFFFF" stroke-width="2"/>
		<line x1="36" y1="148" x2="150" y2="148" stroke="#FFFFFF" stroke-width="4"/>
		<circle cx="150" cy="148" r="8" fill="#FFFFFF"/>
	</g>

</svg>
