<svg width="300" height="220" viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">

	<!-- ===== Light theme ===== -->
	<g class="vscode-light">
		<!-- outer frame -->
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#3C3C3C" stroke-opacity="0.3" stroke-width="1.5"/>

		<!-- limit line -->
		<line x1="20" y1="58" x2="280" y2="58" stroke="#3C3C3C" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

		<!-- baseline -->
		<line x1="20" y1="172" x2="280" y2="172" stroke="#3C3C3C" stroke-opacity="0.3" stroke-width="1.5"/>

		<!-- bars -->
		<rect x="36"  y="142" width="24" height="30"  rx="2" fill="#3C3C3C" fill-opacity="0.35"/>
		<rect x="74"  y="127" width="24" height="45"  rx="2" fill="#3C3C3C" fill-opacity="0.35"/>
		<rect x="112" y="112" width="24" height="60"  rx="2" fill="#3C3C3C" fill-opacity="0.35"/>
		<rect x="150" y="92"  width="24" height="80"  rx="2" fill="#3C3C3C" fill-opacity="0.35"/>
		<rect x="188" y="64"  width="24" height="108" rx="2" fill="#BA7517" fill-opacity="0.55"/>
		<rect x="226" y="42"  width="24" height="130" rx="2" fill="#D85A30" fill-opacity="0.6"/>
	</g>

	<!-- ===== Dark theme ===== -->
	<g class="vscode-dark">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#CCCCCC" stroke-opacity="0.3" stroke-width="1.5"/>

		<line x1="20" y1="58" x2="280" y2="58" stroke="#CCCCCC" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

		<line x1="20" y1="172" x2="280" y2="172" stroke="#CCCCCC" stroke-opacity="0.3" stroke-width="1.5"/>

		<rect x="36"  y="142" width="24" height="30"  rx="2" fill="#CCCCCC" fill-opacity="0.4"/>
		<rect x="74"  y="127" width="24" height="45"  rx="2" fill="#CCCCCC" fill-opacity="0.4"/>
		<rect x="112" y="112" width="24" height="60"  rx="2" fill="#CCCCCC" fill-opacity="0.4"/>
		<rect x="150" y="92"  width="24" height="80"  rx="2" fill="#CCCCCC" fill-opacity="0.4"/>
		<rect x="188" y="64"  width="24" height="108" rx="2" fill="#FAC775" fill-opacity="0.75"/>
		<rect x="226" y="42"  width="24" height="130" rx="2" fill="#F0997B" fill-opacity="0.8"/>
	</g>

	<!-- ===== High contrast theme ===== -->
	<g class="vscode-high-contrast">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>

		<line x1="20" y1="58" x2="280" y2="58" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4"/>

		<line x1="20" y1="172" x2="280" y2="172" stroke="#FFFFFF" stroke-width="1.5"/>

		<rect x="36"  y="142" width="24" height="30"  fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<rect x="74"  y="127" width="24" height="45"  fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<rect x="112" y="112" width="24" height="60"  fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<rect x="150" y="92"  width="24" height="80"  fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<rect x="188" y="64"  width="24" height="108" fill="#FFFFFF"/>
		<rect x="226" y="42"  width="24" height="130" fill="#FFFFFF"/>
	</g>

</svg>
