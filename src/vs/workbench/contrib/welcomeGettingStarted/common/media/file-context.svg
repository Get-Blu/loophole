<svg width="300" height="220" viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">

	<!-- ===== Light theme ===== -->
	<g class="vscode-light">
		<!-- outer frame -->
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#3C3C3C" stroke-opacity="0.3" stroke-width="1.5"/>

		<!-- file chip 1 -->
		<rect x="36" y="60" width="86" height="24" rx="12" fill="#0F6E56" fill-opacity="0.15" stroke="#0F6E56" stroke-opacity="0.5" stroke-width="1.5"/>
		<rect x="46" y="66" width="10" height="12" rx="1" fill="none" stroke="#0F6E56" stroke-opacity="0.7" stroke-width="1.2"/>
		<path d="M53 66 V69 H56" stroke="#0F6E56" stroke-opacity="0.7" stroke-width="1.2" fill="none"/>
		<rect x="62" y="70" width="46" height="4" rx="2" fill="#3C3C3C" fill-opacity="0.5"/>

		<!-- file chip 2 -->
		<rect x="132" y="60" width="78" height="24" rx="12" fill="#0F6E56" fill-opacity="0.15" stroke="#0F6E56" stroke-opacity="0.5" stroke-width="1.5"/>
		<rect x="142" y="66" width="10" height="12" rx="1" fill="none" stroke="#0F6E56" stroke-opacity="0.7" stroke-width="1.2"/>
		<path d="M149 66 V69 H152" stroke="#0F6E56" stroke-opacity="0.7" stroke-width="1.2" fill="none"/>
		<rect x="158" y="70" width="38" height="4" rx="2" fill="#3C3C3C" fill-opacity="0.5"/>

		<!-- input bar -->
		<rect x="36" y="120" width="208" height="28" rx="8" fill="none" stroke="#3C3C3C" stroke-opacity="0.4" stroke-width="1.5"/>

		<!-- paperclip -->
		<rect x="42" y="124" width="10" height="20" rx="5" fill="none" stroke="#3C3C3C" stroke-opacity="0.55" stroke-width="1.4"/>
		<rect x="44" y="127" width="6" height="12" rx="3" fill="none" stroke="#3C3C3C" stroke-opacity="0.55" stroke-width="1.2"/>
	</g>

	<!-- ===== Dark theme ===== -->
	<g class="vscode-dark">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#CCCCCC" stroke-opacity="0.3" stroke-width="1.5"/>

		<rect x="36" y="60" width="86" height="24" rx="12" fill="#5DCAA5" fill-opacity="0.2" stroke="#5DCAA5" stroke-opacity="0.6" stroke-width="1.5"/>
		<rect x="46" y="66" width="10" height="12" rx="1" fill="none" stroke="#5DCAA5" stroke-opacity="0.8" stroke-width="1.2"/>
		<path d="M53 66 V69 H56" stroke="#5DCAA5" stroke-opacity="0.8" stroke-width="1.2" fill="none"/>
		<rect x="62" y="70" width="46" height="4" rx="2" fill="#CCCCCC" fill-opacity="0.5"/>

		<rect x="132" y="60" width="78" height="24" rx="12" fill="#5DCAA5" fill-opacity="0.2" stroke="#5DCAA5" stroke-opacity="0.6" stroke-width="1.5"/>
		<rect x="142" y="66" width="10" height="12" rx="1" fill="none" stroke="#5DCAA5" stroke-opacity="0.8" stroke-width="1.2"/>
		<path d="M149 66 V69 H152" stroke="#5DCAA5" stroke-opacity="0.8" stroke-width="1.2" fill="none"/>
		<rect x="158" y="70" width="38" height="4" rx="2" fill="#CCCCCC" fill-opacity="0.5"/>

		<rect x="36" y="120" width="208" height="28" rx="8" fill="none" stroke="#CCCCCC" stroke-opacity="0.4" stroke-width="1.5"/>

		<rect x="42" y="124" width="10" height="20" rx="5" fill="none" stroke="#CCCCCC" stroke-opacity="0.6" stroke-width="1.4"/>
		<rect x="44" y="127" width="6" height="12" rx="3" fill="none" stroke="#CCCCCC" stroke-opacity="0.6" stroke-width="1.2"/>
	</g>

	<!-- ===== High contrast theme ===== -->
	<g class="vscode-high-contrast">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>

		<rect x="36" y="60" width="86" height="24" rx="12" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<rect x="46" y="66" width="10" height="12" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
		<path d="M53 66 V69 H56" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
		<rect x="62" y="70" width="46" height="4" fill="#FFFFFF"/>

		<rect x="132" y="60" width="78" height="24" rx="12" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<rect x="142" y="66" width="10" height="12" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
		<path d="M149 66 V69 H152" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
		<rect x="158" y="70" width="38" height="4" fill="#FFFFFF"/>

		<rect x="36" y="120" width="208" height="28" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

		<rect x="42" y="124" width="10" height="20" rx="5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
		<rect x="44" y="127" width="6" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
	</g>

</svg>
