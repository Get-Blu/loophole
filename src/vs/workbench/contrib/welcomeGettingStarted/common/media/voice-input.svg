<svg width="300" height="220" viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">

	<!-- ===== Light theme ===== -->
	<g class="vscode-light">
		<!-- outer frame -->
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#3C3C3C" stroke-opacity="0.3" stroke-width="1.5"/>

		<!-- incoming voice waveform -->
		<rect x="34"  y="99" width="6" height="10" rx="3" fill="#0F6E56" fill-opacity="0.45"/>
		<rect x="46"  y="95" width="6" height="18" rx="3" fill="#0F6E56" fill-opacity="0.5"/>
		<rect x="58"  y="89" width="6" height="30" rx="3" fill="#0F6E56" fill-opacity="0.55"/>
		<rect x="70"  y="82" width="6" height="44" rx="3" fill="#0F6E56" fill-opacity="0.6"/>
		<rect x="82"  y="87" width="6" height="34" rx="3" fill="#0F6E56" fill-opacity="0.55"/>
		<rect x="94"  y="93" width="6" height="22" rx="3" fill="#0F6E56" fill-opacity="0.5"/>
		<rect x="106" y="98" width="6" height="12" rx="3" fill="#0F6E56" fill-opacity="0.45"/>

		<!-- mic -->
		<rect x="139" y="72" width="22" height="40" rx="11" fill="#0F6E56" fill-opacity="0.15" stroke="#0F6E56" stroke-opacity="0.6" stroke-width="1.5"/>
		<path d="M131 100 V108 A19 19 0 0 0 169 108 V100" stroke="#3C3C3C" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
		<line x1="150" y1="127" x2="150" y2="140" stroke="#3C3C3C" stroke-opacity="0.5" stroke-width="1.5"/>
		<line x1="138" y1="140" x2="162" y2="140" stroke="#3C3C3C" stroke-opacity="0.5" stroke-width="1.5"/>

		<!-- transcribed words -->
		<rect x="190" y="100" width="16" height="8" rx="3" fill="#3C3C3C" fill-opacity="0.35"/>
		<rect x="214" y="100" width="12" height="8" rx="3" fill="#3C3C3C" fill-opacity="0.35"/>
		<rect x="234" y="100" width="20" height="8" rx="3" fill="#3C3C3C" fill-opacity="0.35"/>
		<rect x="262" y="100" width="14" height="8" rx="3" fill="#3C3C3C" fill-opacity="0.35"/>
	</g>

	<!-- ===== Dark theme ===== -->
	<g class="vscode-dark">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#CCCCCC" stroke-opacity="0.3" stroke-width="1.5"/>

		<rect x="34"  y="99" width="6" height="10" rx="3" fill="#5DCAA5" fill-opacity="0.55"/>
		<rect x="46"  y="95" width="6" height="18" rx="3" fill="#5DCAA5" fill-opacity="0.6"/>
		<rect x="58"  y="89" width="6" height="30" rx="3" fill="#5DCAA5" fill-opacity="0.65"/>
		<rect x="70"  y="82" width="6" height="44" rx="3" fill="#5DCAA5" fill-opacity="0.7"/>
		<rect x="82"  y="87" width="6" height="34" rx="3" fill="#5DCAA5" fill-opacity="0.65"/>
		<rect x="94"  y="93" width="6" height="22" rx="3" fill="#5DCAA5" fill-opacity="0.6"/>
		<rect x="106" y="98" width="6" height="12" rx="3" fill="#5DCAA5" fill-opacity="0.55"/>

		<rect x="139" y="72" width="22" height="40" rx="11" fill="#5DCAA5" fill-opacity="0.2" stroke="#5DCAA5" stroke-opacity="0.7" stroke-width="1.5"/>
		<path d="M131 100 V108 A19 19 0 0 0 169 108 V100" stroke="#CCCCCC" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
		<line x1="150" y1="127" x2="150" y2="140" stroke="#CCCCCC" stroke-opacity="0.5" stroke-width="1.5"/>
		<line x1="138" y1="140" x2="162" y2="140" stroke="#CCCCCC" stroke-opacity="0.5" stroke-width="1.5"/>

		<rect x="190" y="100" width="16" height="8" rx="3" fill="#CCCCCC" fill-opacity="0.4"/>
		<rect x="214" y="100" width="12" height="8" rx="3" fill="#CCCCCC" fill-opacity="0.4"/>
		<rect x="234" y="100" width="20" height="8" rx="3" fill="#CCCCCC" fill-opacity="0.4"/>
		<rect x="262" y="100" width="14" height="8" rx="3" fill="#CCCCCC" fill-opacity="0.4"/>
	</g>

	<!-- ===== High contrast theme ===== -->
	<g class="vscode-high-contrast">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>

		<rect x="34"  y="99" width="6" height="10" fill="#FFFFFF"/>
		<rect x="46"  y="95" width="6" height="18" fill="#FFFFFF"/>
		<rect x="58"  y="89" width="6" height="30" fill="#FFFFFF"/>
		<rect x="70"  y="82" width="6" height="44" fill="#FFFFFF"/>
		<rect x="82"  y="87" width="6" height="34" fill="#FFFFFF"/>
		<rect x="94"  y="93" width="6" height="22" fill="#FFFFFF"/>
		<rect x="106" y="98" width="6" height="12" fill="#FFFFFF"/>

		<rect x="139" y="72" width="22" height="40" rx="11" fill="none" stroke="#FFFFFF" stroke-width="2"/>
		<path d="M131 100 V108 A19 19 0 0 0 169 108 V100" stroke="#FFFFFF" stroke-width="2" fill="none"/>
		<line x1="150" y1="127" x2="150" y2="140" stroke="#FFFFFF" stroke-width="2"/>
		<line x1="138" y1="140" x2="162" y2="140" stroke="#FFFFFF" stroke-width="2"/>

		<rect x="190" y="100" width="16" height="8" fill="#FFFFFF"/>
		<rect x="214" y="100" width="12" height="8" fill="#FFFFFF"/>
		<rect x="234" y="100" width="20" height="8" fill="#FFFFFF"/>
		<rect x="262" y="100" width="14" height="8" fill="#FFFFFF"/>
	</g>

</svg>
