<svg width="300" height="220" viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">

	<!-- ===== Light theme ===== -->
	<g class="vscode-light">
		<!-- outer frame -->
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#3C3C3C" stroke-opacity="0.3" stroke-width="1.5"/>

		<!-- Plan -->
		<rect x="35" y="88" width="50" height="32" rx="16" fill="none" stroke="#3C3C3C" stroke-opacity="0.4" stroke-width="1.5"/>
		<text x="60" y="104" font-family="sans-serif" font-size="11" fill="#3C3C3C" fill-opacity="0.7" text-anchor="middle" dominant-baseline="central">Plan</text>

		<!-- Agent (selected) -->
		<rect x="95" y="88" width="50" height="32" rx="16" fill="#0F6E56" fill-opacity="0.85"/>
		<text x="120" y="104" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Agent</text>

		<!-- Chat -->
		<rect x="155" y="88" width="50" height="32" rx="16" fill="none" stroke="#3C3C3C" stroke-opacity="0.4" stroke-width="1.5"/>
		<text x="180" y="104" font-family="sans-serif" font-size="11" fill="#3C3C3C" fill-opacity="0.7" text-anchor="middle" dominant-baseline="central">Chat</text>

		<!-- Gather -->
		<rect x="215" y="88" width="50" height="32" rx="16" fill="none" stroke="#3C3C3C" stroke-opacity="0.4" stroke-width="1.5"/>
		<text x="240" y="104" font-family="sans-serif" font-size="11" fill="#3C3C3C" fill-opacity="0.7" text-anchor="middle" dominant-baseline="central">Gather</text>
	</g>

	<!-- ===== Dark theme ===== -->
	<g class="vscode-dark">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#CCCCCC" stroke-opacity="0.3" stroke-width="1.5"/>

		<rect x="35" y="88" width="50" height="32" rx="16" fill="none" stroke="#CCCCCC" stroke-opacity="0.4" stroke-width="1.5"/>
		<text x="60" y="104" font-family="sans-serif" font-size="11" fill="#CCCCCC" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">Plan</text>

		<rect x="95" y="88" width="50" height="32" rx="16" fill="#5DCAA5" fill-opacity="0.9"/>
		<text x="120" y="104" font-family="sans-serif" font-size="11" fill="#1E1E1E" text-anchor="middle" dominant-baseline="central">Agent</text>

		<rect x="155" y="88" width="50" height="32" rx="16" fill="none" stroke="#CCCCCC" stroke-opacity="0.4" stroke-width="1.5"/>
		<text x="180" y="104" font-family="sans-serif" font-size="11" fill="#CCCCCC" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">Chat</text>

		<rect x="215" y="88" width="50" height="32" rx="16" fill="none" stroke="#CCCCCC" stroke-opacity="0.4" stroke-width="1.5"/>
		<text x="240" y="104" font-family="sans-serif" font-size="11" fill="#CCCCCC" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">Gather</text>
	</g>

	<!-- ===== High contrast theme ===== -->
	<g class="vscode-high-contrast">
		<rect x="20" y="20" width="260" height="168" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>

		<rect x="35" y="88" width="50" height="32" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<text x="60" y="104" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Plan</text>

		<rect x="95" y="88" width="50" height="32" rx="16" fill="#FFFFFF"/>
		<text x="120" y="104" font-family="sans-serif" font-size="11" fill="#000000" text-anchor="middle" dominant-baseline="central">Agent</text>

		<rect x="155" y="88" width="50" height="32" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<text x="180" y="104" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Chat</text>

		<rect x="215" y="88" width="50" height="32" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
		<text x="240" y="104" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Gather</text>
	</g>

</svg>
